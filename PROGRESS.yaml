# --- Key decisions (mirrors latest ContextCheckpoint) ---
key_decisions:
  - id: D001
    decision: "Deterministic zero-LLM score-based routing"
    rationale: "Saves 100% of classification token cost + ~200ms latency vs LLM routing"
  - id: D002
    decision: "Three tiers: PARSE/CHAT/COMPLEX by score thresholds 35/55"
    rationale: "Maps cleanly to model cost tiers; 35 (not 25) so commands land in PARSE"
  - id: D003
    decision: "Signals expressed as complexity contribution (0-1)"
    rationale: "Uniform scale lets scorer use a single weighted sum; command/conversation signals contribute negatively"
  - id: D004
    decision: "Native Python + pytest validation for Stage 1 (no Docker/Redis needed)"
    rationale: "Routing is pure computation; fastest, most transparent feedback loop"
  - id: D005
    decision: "PROGRESS.yaml enabled from day one (NEW-2)"
    rationale: "Cross-window continuity must be reliable from the first commit"
  - id: D006
    decision: "Markdown as wiki source of truth; vector index derived/rebuildable"
    rationale: "Human-auditable, git-friendly, never loses data if vector store corrupts"
  - id: D007
    decision: "Pluggable WikiBackend Protocol (LocalFilesystemBackend + HttpBackend)"
    rationale: "WikiStore code never changes when server deploy lands; HTTP REST contract fixed now"
  - id: D008
    decision: "Deterministic regex extractor as default; LLM extractor reserved (Stage 3)"
    rationale: "Tests run network-free; precision over recall to avoid polluting memory"


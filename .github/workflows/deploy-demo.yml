# =============================================================================
# Aether-Agent v2 — GitHub Pages 自动部署工作流
# =============================================================================
# 将 demo/ 目录部署为 GitHub Pages 站点
# 触发条件: 推送到 main 分支或手动触发
#
# 部署后访问地址:
#   https://entropy-reverser.github.io/Aether-Agent/
# =============================================================================
name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main, stage-1-routing]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
